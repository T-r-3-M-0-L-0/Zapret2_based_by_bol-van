# NFQWS_OPT - fZapret2 Hybrid strategy, APPROXIMATE conversion for zapret1 (nfqws v1).
# Use ONLY if the router cannot run zapret2 (Zapret-Manager Zapret2 requires
# aarch64_cortex-a53; for other CPUs use remittor zapret2 packages instead).
# zapret1 has no lua engine: chains below are mapped to --dpi-desync equivalents.
# Known losses vs the zapret2 original:
#   * ip_id=zero  -> --ip-id=zero (global, not per-chain)
#   * fake_default_quic blob -> default fake quic of zapret1
#   * fake_default_tls with tls_mod -> --dpi-desync-fake-tls-mod
#   * profile order/priority semantics are the same (--new separated, first match wins)
# Ports to set in the manager (or /opt/zapret2 -> zapret1 config):
#   NFQWS_PORTS_TCP=80,443,2053,2083,2087,2096,8443
#   NFQWS_PORTS_UDP=443,1024-65535

# === 09 quic discord (fake_default_quic x6) ===
--filter-udp=443 --hostlist-domains=discord.com,discord.gg,gateway.discord.gg,discordapp.com,discordapp.net,discordcdn.com,discord.media,discordstatus.com,updates.discord.com
--dpi-desync=fake --dpi-desync-repeats=6

--new
# === 10 quic general (list-general) ===
--filter-udp=443 --hostlist=/opt/zapret/ipset/list-general.txt --hostlist=/opt/zapret/ipset/list-general-user.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude-user.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude-user.txt
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic=/opt/zapret/files/fake/quic_initial_www_google_com.bin

--new
# === 20 discord voice udp ===
--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-any-protocol=1 --dpi-desync-fake-unknown-udp=/opt/zapret/files/fake/quic_initial_vk_com.bin

--new
# === 30 discord updates ===
--filter-tcp=443 --hostlist-domains=updates.discord.com
--dpi-desync=fake,multisplit --dpi-desync-split-pos=1 --dpi-desync-split-seqovl=681 --dpi-desync-split-seqovl-pattern=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin
--dpi-desync-fooling=badseq --dpi-desync-repeats=8 --dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin

--new
# === 40 discord media images ===
--filter-tcp=443 --hostlist-domains=media.discordapp.net,images-ext-1.discordapp.net,images-ext-2.discordapp.net
--dpi-desync=fake,fakedsplit --dpi-desync-fooling=ts --dpi-desync-repeats=8 --dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_max_ru.bin

--new
# === 50 discord cdn ===
--filter-tcp=443 --hostlist-domains=cdn.discordapp.com,stable.dl2.discordapp.net
--dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-split-seqovl=652 --dpi-desync-split-seqovl-pattern=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin
--dpi-desync-fooling=badseq --dpi-desync-repeats=8 --dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin

--new
# === 60 discord main ===
--filter-tcp=443,2053,2083,2087,2096,8443 --hostlist-domains=discord.com,discord.gg,gateway.discord.gg,discordapp.com,discordapp.net,discordcdn.com,discord.media,discordstatus.com
--dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,sniext+1,midsld
--dpi-desync-fooling=badseq --dpi-desync-repeats=8 --dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin --dpi-desync-fake-tls-mod=rnd,dupsid,sni=ozon.ru

--new
# === 68 googlevideo (multidisorder) ===
--filter-tcp=443 --hostlist=/opt/zapret/ipset/list-googlevideo.txt
--dpi-desync=multidisorder --dpi-desync-split-pos=1,midsld

--new
# === 70 google ===
--filter-tcp=443 --hostlist=/opt/zapret/ipset/list-google.txt
--dpi-desync=fake,fakedsplit --dpi-desync-fooling=ts --dpi-desync-repeats=6 --ip-id=zero
--dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin

--new
# === 71 github ===
--filter-tcp=443 --hostlist=/opt/zapret/ipset/list-github.txt
--dpi-desync=fake,fakedsplit --dpi-desync-fooling=ts --dpi-desync-repeats=6 --ip-id=zero
--dpi-desync-fake-tls=/opt/zapret/files/fake/tls_clienthello_www_google_com.bin

--new
# === 81 ipset quic ===
--filter-udp=443 --ipset=/opt/zapret/ipset/ipset-all.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude-user.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude-user.txt
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic=/opt/zapret/files/fake/quic_initial_www_google_com.bin

--new
# === 82 ipset tcp ===
--filter-tcp=80,443,8443 --ipset=/opt/zapret/ipset/ipset-all.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude-user.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude-user.txt
--dpi-desync=hostfakesplit --dpi-desync-hostfakesplit-mod=host=ozon.ru --dpi-desync-fooling=ts --dpi-desync-repeats=4

--new
# === 90 game udp ===
--filter-udp=7711,12000
--dpi-desync=fake --dpi-desync-repeats=1 --dpi-desync-autottl=6 --dpi-desync-any-protocol=1 --dpi-desync-fake-unknown-udp=/opt/zapret/files/fake/quic_initial_dbankcloud_ru.bin

--new
# === 91 udp catchall ===
--filter-udp=1024-3477,3481-19293,19345-49999,50101-65535
--dpi-desync=fake --dpi-desync-repeats=8 --dpi-desync-autottl=6 --dpi-desync-any-protocol=1 --dpi-desync-fake-unknown-udp=/opt/zapret/files/fake/quic_initial_dbankcloud_ru.bin --dpi-desync-cutoff=n2

--new
# === 97 general list (fake badseq + multidisorder) ===
--filter-tcp=80,443 --hostlist=/opt/zapret/ipset/list-general.txt --hostlist=/opt/zapret/ipset/list-general-user.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude.txt --hostlist-exclude=/opt/zapret/ipset/list-exclude-user.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude.txt --ipset-exclude=/opt/zapret/ipset/ipset-exclude-user.txt
--dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld
--dpi-desync-fooling=badseq --dpi-desync-repeats=11 --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com

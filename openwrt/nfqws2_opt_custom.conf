# NFQWS2_OPT - fZapret2 Hybrid strategy ported for OpenWrt zapret2 (nfqws2)
# Source: C:\fZapret2 Custom.bat (15 profiles). Paste whole text into the
# zapret2 strategy editor (LuCI -> Zapret2) or /etc/config/zapret2.
# Global init (blobs + lua). On openwrt there are NO --wf-* filters:
# interception is done by nftables NFQUEUE; set ports separately:
#   NFQWS2_PORTS_TCP=80,443,2053,2083,2087,2096,8443
#   NFQWS2_PORTS_UDP=443,1024-65535

--lua-init=@"/opt/zapret2/files/lua/zapret-lib.lua" --lua-init=@"/opt/zapret2/files/lua/zapret-antidpi.lua" --lua-init="fake_default_tls=tls_mod(fake_default_tls,'rnd,rndsni')" --blob=tls_google:@"/opt/zapret2/files/fake/tls_clienthello_www_google_com.bin" --blob=tls_max:@"/opt/zapret2/files/fake/tls_clienthello_max_ru.bin" --blob=tls_4pda:@"/opt/zapret2/files/fake/tls_clienthello_4pda_to.bin" --blob=tls_sferum:@"/opt/zapret2/files/fake/tls_clienthello_www_sferum_ru.bin" --blob=tls_sochi:@"/opt/zapret2/files/fake/tls_clienthello_sochi_park.bin" --blob=stun:@"/opt/zapret2/files/fake/stun.bin" --blob=stun2:@"/opt/zapret2/files/fake/stun2.bin" --blob=quic_google:@"/opt/zapret2/files/fake/quic_initial_www_google_com.bin" --blob=quic_vk:@"/opt/zapret2/files/fake/quic_initial_vk_com.bin" --blob=quic_ru:@"/opt/zapret2/files/fake/quic_initial_dbankcloud_ru.bin" --lua-init="tls_ozon=tls_mod(tls_google,'sni=ozon.ru')" --lua-init="tls_max_ozon=tls_mod(tls_max,'sni=ozon.ru')" --lua-init="tls_def_ozon=tls_mod(fake_default_tls,'sni=ozon.ru')"

--new

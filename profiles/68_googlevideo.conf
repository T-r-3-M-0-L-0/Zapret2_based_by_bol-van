# GoogleVideo video streams (list-googlevideo.txt) - blockcheck winner for youtube:
# pure cut at ClientHello, no fake packets. Separated from 70_google so the video
# path can be tuned independently (SABR POST stalls on throttled edge nodes).
--filter-tcp=443 --filter-l7=tls --hostlist="%LISTS%list-googlevideo.txt"
--payload=tls_client_hello --out-range=-d10
--lua-desync=multidisorder:pos=1,midsld

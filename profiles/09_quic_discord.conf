# QUIC 443 for Discord (app + CDN) - blockcheck quic winner 14.11:
# quic_google blob does NOT pass for discord CDN, generic fake_default_quic does.
# Sorts before 10_quic_general so discord hosts get this chain instead of x6 google.
--filter-udp=443 --filter-l7=quic --hostlist-domains=discord.com,discord.gg,gateway.discord.gg,discordapp.com,discordapp.net,discordcdn.com,discord.media,discordstatus.com,updates.discord.com
--payload=quic_initial
--lua-desync=fake:blob=fake_default_quic:repeats=6
